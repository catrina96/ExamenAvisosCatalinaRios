<ion-header><ion-toolbar><ion-title>Confirmar</ion-title></ion-toolbar></ion-header>

  <p>¿Desea eliminar esta publicación?</p>
  <ion-button color="danger" expand="block" (click)="confirm()">Eliminar</ion-button>
  <ion-button expand="block" fill="clear" (click)="cancel()">Cancelar</ion-button>
</ion-content>
